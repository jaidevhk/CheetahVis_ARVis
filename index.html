<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AR Overlay">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>AR Overlay</title>
<style>
  :root {
    --panel-bg: rgba(18, 18, 20, 0.84);
    --panel-line: rgba(255, 255, 255, 0.09);
    --text: #f2f2f4;
    --muted: #9a9aa3;
    --accent: #4da3ff;
    --danger: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  }
  #feed, #view { position: fixed; inset: 0; width: 100%; height: 100%; }
  #feed { object-fit: cover; background: radial-gradient(ellipse at 50% 35%, #3a3d44, #15161a 70%); }
  #view { touch-action: none; display: block; }

  /* Start screen */
  #start {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px;
    background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #start.gone { display: none; }
  .card {
    width: min(380px, 100%); background: var(--panel-bg); border: 1px solid var(--panel-line);
    border-radius: 20px; padding: 24px; text-align: center;
  }
  .card h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
  .card p { margin: 0 0 20px; color: var(--muted); }
  .card .err { color: var(--danger); margin: 14px 0 0; min-height: 1em; }
  .btn {
    appearance: none; border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600;
    background: rgba(255, 255, 255, 0.1); color: var(--text); cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #031426; width: 100%; padding: 14px; font-size: 16px; }
  .btn.link { background: none; color: var(--muted); font-weight: 500; margin-top: 10px; }

  /* Panel */
  #panel {
    position: fixed; z-index: 20; display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-line); border-radius: var(--radius);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    top: max(12px, env(safe-area-inset-top)); bottom: max(12px, env(safe-area-inset-bottom));
    right: max(12px, env(safe-area-inset-right)); width: 330px;
  }
  @media (max-aspect-ratio: 1/1) {
    #panel {
      top: auto; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
      width: auto; height: 46vh; bottom: max(8px, env(safe-area-inset-bottom));
    }
  }
  .head {
    display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 14px;
    border-bottom: 1px solid var(--panel-line);
  }
  .head .title { font-weight: 650; flex: 1; }
  .head .status { color: var(--muted); font-size: 12px; font-weight: 400; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .head .btn { padding: 7px 10px; font-size: 13px; }
  .body { overflow-y: auto; flex: 1; padding: 4px 0 8px; -webkit-overflow-scrolling: touch; }
  details.sec { border-bottom: 1px solid var(--panel-line); }
  details.sec > summary {
    list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "›"; color: var(--muted); font-size: 18px; transition: transform .15s; }
  details.sec[open] > summary::after { transform: rotate(90deg); }
  .rows { padding: 0 14px 10px; display: grid; gap: 12px; }
  .row .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .row label { color: var(--muted); font-size: 13px; }
  .row .val { display: flex; align-items: baseline; gap: 3px; }
  .row .unit { color: var(--muted); font-size: 12px; min-width: 10px; }
  .num {
    width: 68px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: var(--text);
    background: rgba(255,255,255,0.06); border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
    -webkit-user-select: text; user-select: text;
  }
  .num:focus { outline: none; border-color: var(--accent); }
  .num::-webkit-inner-spin-button { display: none; }
  .slide { display: flex; align-items: center; gap: 8px; }
  .slide input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; margin: 0; }
  .nudge {
    width: 30px; height: 30px; flex: none; border-radius: 8px; border: 0; font: 600 16px/1 inherit;
    background: rgba(255,255,255,0.08); color: var(--text); touch-action: manipulation;
  }
  .nudge:active { background: rgba(255,255,255,0.18); }
  .inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  select, input[type=color] {
    font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 0; border-radius: 8px;
    padding: 6px 8px; max-width: 190px;
  }
  input[type=color] { width: 56px; height: 32px; padding: 2px; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 13px; background: rgba(255,255,255,0.16); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .hint { color: var(--muted); font-size: 12px; margin: -4px 0 0; }
  .foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-top: 1px solid var(--panel-line); }
  .foot .btn { flex: 1 1 auto; font-size: 13px; padding: 9px 8px; }
  .foot .btn.warn { color: var(--danger); }
  @media (max-aspect-ratio: 1/1) {
    .foot { flex-wrap: nowrap; overflow-x: auto; }
    .foot .btn { flex: none; }
  }

  #showBtn {
    position: fixed; z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 0;
    right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.35); color: rgba(255,255,255,0.75); font-size: 20px; display: none;
  }
  body.closed #panel { display: none; }
  body.closed #showBtn { display: block; }
  body.bare #panel, body.bare #showBtn { display: none; }

  #toast {
    position: fixed; z-index: 40; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translate(-50%, -8px);
    background: rgba(0,0,0,0.78); padding: 9px 14px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #fileIn { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body class="closed">
<video id="feed" playsinline muted autoplay></video>
<canvas id="view"></canvas>

<div id="start">
  <div class="card">
    <h1>AR Overlay</h1>
    <p>Uses the rear camera as a live background. Keep the device still, then line the model up with the controls.</p>
    <button class="btn primary" id="startCam">Start camera</button>
    <button class="btn link" id="startNoCam">Continue without camera</button>
    <p class="err" id="startErr"></p>
  </div>
</div>

<aside id="panel">
  <div class="head">
    <div class="title">Controls<span class="status" id="status">Loading model…</span></div>
    <button class="btn" id="bareBtn" title="Hide everything — double-tap to bring back">Hide all</button>
    <button class="btn" id="closeBtn" aria-label="Close panel">✕</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot">
    <button class="btn" id="loadBtn">Load model…</button>
    <button class="btn" id="fsBtn">Fullscreen</button>
    <button class="btn" id="copyBtn">Copy settings</button>
    <button class="btn" id="pasteBtn">Paste settings</button>
    <button class="btn warn" id="resetBtn">Reset</button>
  </div>
</aside>
<button id="showBtn" aria-label="Show controls">☰</button>
<input type="file" id="fileIn">
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Config ----------
const MODEL_URL = 'model.glb'; // put your model next to index.html with this name
const FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb';
const STORE_KEY = 'ar-overlay-settings-v1';

const DEFS = [
  { section: 'Placement', open: true, items: [
    { key: 'posX', label: 'Left / right', min: -5, max: 5, step: 0.01, def: 0, unit: 'm' },
    { key: 'posZ', label: 'Distance from device', min: 0.3, max: 15, step: 0.01, def: 3, unit: 'm' },
    { key: 'posY', label: 'Surface height (0 = floor)', min: -1, max: 2, step: 0.01, def: 0, unit: 'm' },
    { key: 'rotY', label: 'Rotation', min: -180, max: 180, step: 1, def: 0, unit: '°' },
    { key: 'size', label: 'Model height', min: 0.05, max: 10, step: 0.01, def: 1.2, unit: 'm' },
    { type: 'hint', text: 'Touch: drag to move on the floor, pinch to scale, twist to rotate.' },
  ]},
  { section: 'Animation', items: [
    { type: 'clip', key: 'clip', label: 'Clip' },
    { type: 'toggle', key: 'playing', label: 'Playing', def: true },
    { key: 'animSpeed', label: 'Speed', min: 0, max: 3, step: 0.05, def: 1, unit: '×' },
  ]},
  { section: 'Camera match', items: [
    { type: 'lens', key: 'lens', label: 'Lens' },
    { key: 'camH', label: 'Device height above floor', min: 0.05, max: 3, step: 0.01, def: 1.2, unit: 'm' },
    { key: 'camTilt', label: 'Tilt down', min: -45, max: 85, step: 0.1, def: 10, unit: '°' },
    { key: 'camRoll', label: 'Roll', min: -20, max: 20, step: 0.1, def: 0, unit: '°' },
    { key: 'fov', label: 'Lens field of view (long edge)', min: 30, max: 120, step: 0.1, def: 68, unit: '°' },
    { type: 'toggle', key: 'grid', label: 'Show 1 m floor grid', def: false },
    { type: 'hint', text: 'Turn the grid on, measure the device height, then adjust tilt and field of view until the grid sits flat on the real floor.' },
  ]},
  { section: 'Lighting', items: [
    { key: 'lightAz', label: 'Sun direction', min: 0, max: 360, step: 1, def: 35, unit: '°' },
    { key: 'lightEl', label: 'Sun height', min: 3, max: 90, step: 1, def: 50, unit: '°' },
    { key: 'lightInt', label: 'Sun intensity', min: 0, max: 10, step: 0.05, def: 2.5 },
    { type: 'color', key: 'lightColor', label: 'Sun colour', def: '#fff4e5' },
    { key: 'ambInt', label: 'Ambient light', min: 0, max: 3, step: 0.05, def: 0.4 },
    { type: 'color', key: 'ambColor', label: 'Ambient colour', def: '#dfe8ff' },
    { key: 'envInt', label: 'Reflections', min: 0, max: 3, step: 0.05, def: 0.8 },
    { key: 'exposure', label: 'Exposure', min: 0.2, max: 3, step: 0.01, def: 1 },
  ]},
  { section: 'Shadow', items: [
    { key: 'shadowOpacity', label: 'Shadow darkness', min: 0, max: 1, step: 0.01, def: 0.45 },
    { key: 'shadowSoft', label: 'Shadow softness', min: 0, max: 12, step: 0.1, def: 3 },
  ]},
  { section: 'Camera feed', items: [
    { key: 'feedBright', label: 'Brightness', min: 0.3, max: 2, step: 0.01, def: 1 },
    { key: 'feedContrast', label: 'Contrast', min: 0.5, max: 1.6, step: 0.01, def: 1 },
    { key: 'feedSat', label: 'Saturation', min: 0, max: 2, step: 0.01, def: 1 },
  ]},
  { section: 'Behaviour', items: [
    { type: 'toggle', key: 'lockGestures', label: 'Lock touch gestures', def: false },
  ]},
];

const DEFAULTS = {};
for (const s of DEFS) for (const it of s.items) if (it.key && 'def' in it) DEFAULTS[it.key] = it.def;
DEFAULTS.clip = '';
DEFAULTS.lens = '';

// ---------- Settings ----------
let stored = {};
try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch {}
const S = { ...DEFAULTS, ...stored };
let sizeIsSet = 'size' in stored;
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
  }, 250);
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const video = $('feed'), canvas = $('view');
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  n.append(...kids);
  return n;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;
const decimals = step => step < 1 ? (String(step).split('.')[1] || '').length : 0;
let toastTimer;
function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
function setStatus(msg) { $('status').textContent = msg; }

// ---------- Three.js scene ----------
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, 1, 0.02, 200);
camera.rotation.order = 'YXZ';

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.blurSamples = 16;
scene.add(sun, sun.target);

const shadowMat = new THREE.ShadowMaterial({ opacity: 0.45 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), shadowMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(20, 20, 0x4da3ff, 0xffffff);
grid.material.transparent = true;
grid.material.opacity = 0.55;
grid.position.z = -10;
scene.add(grid);

const pivot = new THREE.Group(); // positioned/rotated/scaled by settings
const inner = new THREE.Group(); // recentres the model so its base sits on the floor
pivot.add(inner);
scene.add(pivot);

let model = null, mixer = null, clips = [], action = null, naturalHeight = 1;
const clock = new THREE.Clock();

// ---------- Apply settings ----------
function updateProjection() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const half = rad(S.fov) / 2;
  const vw = video.videoWidth, vh = video.videoHeight;
  let vfov;
  if (vw && vh) {
    // Lens FOV refers to the video's long edge; account for object-fit: cover cropping.
    const f = (Math.max(vw, vh) / 2) / Math.tan(half);
    const s = Math.max(W / vw, H / vh);
    vfov = 2 * Math.atan((H / s / 2) / f);
  } else {
    const f = (Math.max(W, H) / 2) / Math.tan(half);
    vfov = 2 * Math.atan((H / 2) / f);
  }
  camera.fov = deg(vfov);
  camera.updateProjectionMatrix();
}

function apply() {
  camera.position.set(0, S.camH, 0);
  camera.rotation.set(-rad(S.camTilt), 0, rad(S.camRoll));
  updateProjection();

  pivot.position.set(S.posX, S.posY, -S.posZ);
  pivot.rotation.y = rad(S.rotY);
  pivot.scale.setScalar(S.size / naturalHeight);
  floor.position.y = S.posY; // the model stands on a surface at this height (floor = 0, table ≈ 0.75)
  grid.visible = !!S.grid;

  const az = rad(S.lightAz), el = rad(S.lightEl);
  const dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  const dist = Math.max(S.size * 4, 6);
  sun.target.position.copy(pivot.position);
  sun.position.copy(pivot.position).addScaledVector(dir, dist);
  sun.intensity = S.lightInt;
  sun.color.set(S.lightColor);
  const ext = S.size * 1.6 + 0.6;
  Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 0.1, far: dist * 2 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.radius = S.shadowSoft;

  hemi.intensity = S.ambInt;
  hemi.color.set(S.ambColor);
  scene.environmentIntensity = S.envInt;
  renderer.toneMappingExposure = S.exposure;
  shadowMat.opacity = S.shadowOpacity;

  video.style.filter = `brightness(${S.feedBright}) contrast(${S.feedContrast}) saturate(${S.feedSat})`;
  if (mixer) mixer.timeScale = S.playing ? S.animSpeed : 0;
}

// ---------- Panel ----------
const controls = {}; // key -> setter that refreshes the UI from S
let clipSelect, lensSelect;

function change(key, v) {
  S[key] = v;
  if (key === 'size') sizeIsSet = true;
  controls[key]?.(v);
  apply();
  save();
}

function rangeRow(it) {
  const range = el('input', { type: 'range', min: it.min, max: it.max, step: it.step });
  const num = el('input', { type: 'number', class: 'num', min: it.min, max: it.max, step: it.step, inputmode: 'decimal' });
  const minus = el('button', { class: 'nudge', type: 'button', 'aria-label': 'Decrease' }, '−');
  const plus = el('button', { class: 'nudge', type: 'button', 'aria-label': 'Increase' }, '+');
  const d = decimals(it.step);
  controls[it.key] = v => { range.value = v; if (document.activeElement !== num) num.value = (+v).toFixed(d); };
  range.addEventListener('input', () => change(it.key, parseFloat(range.value)));
  num.addEventListener('change', () => {
    const v = parseFloat(num.value);
    change(it.key, isNaN(v) ? S[it.key] : clamp(v, it.min, it.max));
    num.value = (+S[it.key]).toFixed(d);
  });
  const nudge = sign => change(it.key, clamp(+(S[it.key] + sign * it.step).toFixed(d), it.min, it.max));
  // press-and-hold repeats
  for (const [b, sign] of [[minus, -1], [plus, 1]]) {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); nudge(sign);
      t1 = setTimeout(() => { t2 = setInterval(() => nudge(sign), 50); }, 380);
    });
    b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  }
  return el('div', { class: 'row' },
    el('div', { class: 'top' }, el('label', {}, it.label), el('span', { class: 'val' }, num, el('span', { class: 'unit' }, it.unit || ''))),
    el('div', { class: 'slide' }, minus, range, plus));
}

function inlineRow(label, control) {
  return el('div', { class: 'row inline' }, el('label', {}, label), control);
}

function buildItem(it) {
  switch (it.type) {
    case 'hint': return el('p', { class: 'hint' }, it.text);
    case 'toggle': {
      const cb = el('input', { type: 'checkbox' });
      controls[it.key] = v => { cb.checked = !!v; };
      cb.addEventListener('change', () => change(it.key, cb.checked));
      return inlineRow(it.label, el('label', { class: 'switch' }, cb, el('span')));
    }
    case 'color': {
      const c = el('input', { type: 'color' });
      controls[it.key] = v => { c.value = v; };
      c.addEventListener('input', () => change(it.key, c.value));
      return inlineRow(it.label, c);
    }
    case 'clip': {
      clipSelect = el('select', {}, el('option', {}, '—'));
      clipSelect.addEventListener('change', () => { S.clip = clipSelect.value; playClip(); save(); });
      return inlineRow(it.label, clipSelect);
    }
    case 'lens': {
      lensSelect = el('select', {}, el('option', {}, 'Default'));
      lensSelect.addEventListener('change', () => switchLens(lensSelect.value));
      return inlineRow(it.label, lensSelect);
    }
    default: return rangeRow(it);
  }
}

function buildPanel() {
  const body = $('body');
  for (const sec of DEFS) {
    const d = el('details', { class: 'sec' });
    if (sec.open) d.open = true;
    d.append(el('summary', {}, sec.section), el('div', { class: 'rows' }, ...sec.items.map(buildItem)));
    body.append(d);
  }
}
function refreshUI() { for (const k in controls) controls[k](S[k]); }

// ---------- Model ----------
const loader = new GLTFLoader();
loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/'));
loader.setMeshoptDecoder(MeshoptDecoder);

function setModel(gltf, name, isFallback) {
  if (model) {
    inner.remove(model);
    mixer?.stopAllAction();
    model.traverse(o => { o.geometry?.dispose(); });
  }
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  inner.add(model);
  naturalHeight = size.y > 1e-6 ? size.y : 1;

  if (!sizeIsSet) {
    S.size = isFallback ? 1.2 : (naturalHeight >= 0.05 && naturalHeight <= 10 ? +naturalHeight.toFixed(2) : 1);
  }

  mixer = new THREE.AnimationMixer(model);
  clips = gltf.animations || [];
  clipSelect.replaceChildren(...(clips.length ? clips.map(c => el('option', { value: c.name }, c.name || '(unnamed)')) : [el('option', {}, 'No animations')]));
  clipSelect.disabled = !clips.length;
  if (!clips.find(c => c.name === S.clip)) {
    // prefer something that looks like an idle/dance loop for the demo robot, else the first clip
    S.clip = (clips.find(c => /dance|idle/i.test(c.name)) || clips[0])?.name || '';
  }
  clipSelect.value = S.clip;
  playClip();
  apply();
  refreshUI();
  setStatus(name + (clips.length ? ` · ${clips.length} anim` : ''));
}

function playClip() {
  if (!mixer) return;
  const clip = clips.find(c => c.name === S.clip);
  const next = clip ? mixer.clipAction(clip) : null;
  if (next === action) return;
  if (action && next) { next.reset().play(); action.crossFadeTo(next, 0.3, false); }
  else if (next) next.play();
  else action?.stop();
  action = next;
}

function loadModel(url, name, isFallback = false) {
  return new Promise((resolve, reject) => {
    setStatus('Loading model…');
    loader.load(url, gltf => { setModel(gltf, name, isFallback); resolve(); },
      e => { if (e.total) setStatus(`Loading ${Math.round(e.loaded / e.total * 100)}%`); },
      reject);
  });
}

loadModel(MODEL_URL, 'model.glb').catch(() =>
  loadModel(FALLBACK_URL, 'Demo robot (add model.glb)', true).catch(() => setStatus('Model failed to load')));

$('loadBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  loadModel(url, f.name).then(() => toast(`Loaded ${f.name} (this session only)`))
    .catch(() => toast('Could not read that file — use a .glb')).finally(() => URL.revokeObjectURL(url));
  e.target.value = '';
};

// ---------- Camera feed ----------
let stream = null, started = false, wantCamera = false;

async function openCamera(deviceId) {
  stream?.getTracks().forEach(t => t.stop());
  const video_ = deviceId
    ? { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    : { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } };
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video_ });
  video.srcObject = stream;
  await video.play().catch(() => {});
  await listLenses();
}

async function listLenses() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  lensSelect.replaceChildren(...devs.map((d, i) => el('option', { value: d.deviceId }, d.label || `Camera ${i + 1}`)));
  if (current) lensSelect.value = current;
  return devs;
}

async function switchLens(deviceId) {
  try {
    await openCamera(deviceId);
    S.lens = lensSelect.selectedOptions[0]?.textContent || '';
    save();
  } catch (err) { toast('Could not switch camera'); }
}

async function start(withCamera) {
  const errEl = $('startErr');
  wantCamera = withCamera;
  if (withCamera) {
    if (!navigator.mediaDevices?.getUserMedia) {
      errEl.textContent = 'Camera needs HTTPS (GitHub Pages is fine) and a modern browser.';
      return;
    }
    try {
      await openCamera();
      // restore the previously chosen lens by its label (device IDs can change between sessions)
      if (S.lens) {
        const match = [...lensSelect.options].find(o => o.textContent === S.lens);
        if (match && match.value !== lensSelect.value) { lensSelect.value = match.value; await openCamera(match.value); }
      }
    } catch (err) {
      errEl.textContent = err.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow it in the browser settings and reload.'
        : `Camera error: ${err.message || err.name}`;
      return;
    }
  }
  started = true;
  $('start').classList.add('gone');
  document.body.classList.remove('closed');
  goFullscreen();
  keepAwake();
}
$('startCam').onclick = () => start(true);
$('startNoCam').onclick = () => start(false);

video.addEventListener('loadedmetadata', updateProjection);
video.addEventListener('resize', updateProjection);
addEventListener('resize', updateProjection);
screen.orientation?.addEventListener?.('change', () => setTimeout(updateProjection, 200));

// ---------- Fullscreen + screen wake ----------
function goFullscreen() {
  const d = document.documentElement;
  (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d, { navigationUI: 'hide' })?.catch?.(() => {});
}
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) goFullscreen();
  else toast('On iPhone: Share → Add to Home Screen for fullscreen', 3500);
};

let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !started) return;
  keepAwake();
  // iOS can kill the camera track while backgrounded — reopen it
  const track = stream?.getVideoTracks()[0];
  if (wantCamera && (!track || track.readyState === 'ended')) {
    try { await openCamera(lensSelect.value || undefined); } catch {}
  }
});

// ---------- Panel buttons ----------
$('closeBtn').onclick = () => document.body.classList.add('closed');
$('showBtn').onclick = () => document.body.classList.remove('closed');
$('bareBtn').onclick = () => { document.body.classList.add('bare'); toast('Double-tap anywhere to bring the controls back', 3000); };
$('resetBtn').onclick = () => {
  if (!confirm('Reset all settings to defaults?')) return;
  Object.assign(S, DEFAULTS);
  sizeIsSet = false;
  if (model) S.size = naturalHeight >= 0.05 && naturalHeight <= 10 ? +naturalHeight.toFixed(2) : 1.2;
  apply(); refreshUI(); save(); playClip();
};
$('copyBtn').onclick = async () => {
  const txt = JSON.stringify(S, null, 2);
  try { await navigator.clipboard.writeText(txt); toast('Settings copied'); }
  catch { prompt('Copy these settings:', JSON.stringify(S)); }
};
$('pasteBtn').onclick = () => {
  const txt = prompt('Paste settings JSON:');
  if (!txt) return;
  try {
    const obj = JSON.parse(txt);
    for (const k in DEFAULTS) if (k in obj) S[k] = obj[k];
    sizeIsSet = 'size' in obj || sizeIsSet;
    apply(); refreshUI(); save(); playClip();
    toast('Settings applied');
  } catch { toast('That is not valid settings JSON'); }
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h') document.body.classList.toggle('bare');
});

// ---------- Touch gestures ----------
const pointers = new Map();
const raycaster = new THREE.Raycaster();
let gesture = null, uiQueued = false, lastTap = 0, downInfo = null;

function floorHit(x, y) {
  const ndc = new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -S.posY), new THREE.Vector3());
}

function beginGesture() {
  gesture = null;
  if (S.lockGestures || !model) return;
  const pts = [...pointers.values()];
  if (pts.length === 1) {
    const hit = floorHit(pts[0].x, pts[0].y);
    if (hit) gesture = { type: 'drag', offX: S.posX - hit.x, offZ: S.posZ + hit.z };
  } else if (pts.length === 2) {
    const [a, b] = pts;
    gesture = { type: 'pinch', d0: Math.hypot(b.x - a.x, b.y - a.y), a0: Math.atan2(b.y - a.y, b.x - a.x), size0: S.size, rot0: S.rotY };
  }
}

function queueUI() {
  if (uiQueued) return;
  uiQueued = true;
  requestAnimationFrame(() => { uiQueued = false; refreshUI(); save(); });
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) downInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
  beginGesture();
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  const pts = [...pointers.values()];
  if (gesture.type === 'drag' && pts.length === 1) {
    const hit = floorHit(pts[0].x, pts[0].y);
    if (!hit) return;
    S.posX = clamp(hit.x + gesture.offX, -5, 5);
    S.posZ = clamp(-hit.z + gesture.offZ, 0.3, 15);
  } else if (gesture.type === 'pinch' && pts.length === 2) {
    const [a, b] = pts;
    const d = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
    S.size = clamp(gesture.size0 * d / gesture.d0, 0.05, 10);
    sizeIsSet = true;
    let r = gesture.rot0 - deg(ang - gesture.a0);
    r = ((r + 540) % 360) - 180;
    S.rotY = Math.round(r);
  }
  apply();
  queueUI();
});
function endPointer(e) {
  if (!pointers.delete(e.pointerId)) return;
  if (pointers.size === 0 && downInfo) {
    const quick = performance.now() - downInfo.t < 250 && Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) < 12;
    if (quick) {
      const now = performance.now();
      if (now - lastTap < 320 && started) { document.body.classList.toggle('bare'); lastTap = 0; }
      else lastTap = now;
    }
    downInfo = null;
  }
  beginGesture();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---------- Go ----------
buildPanel();
refreshUI();
apply();
renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  renderer.render(scene, camera);
});
</script>
</body>
</html>

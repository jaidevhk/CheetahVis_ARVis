<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"

<style>
  :root {
    --glass: rgba(8, 8, 10, 0.26);
    --glass-strong: rgba(8, 8, 10, 0.4);
    --line: rgba(255, 255, 255, 0.22);
    --line-soft: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --accent: #4da3ff;
    --danger: #ff8080;
    --btn: 44px;
    --gap: 8px;
    --edge: max(10px, env(safe-area-inset-right));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  }
  #camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* everything floating over the video stays legible without solid backgrounds */
  #rail, #panel, #hud, #toast { text-shadow: 0 1px 2px rgba(0,0,0,0.85); }

  /* Start screen (before AR — not over the video) */
  #start {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 35%, #2c2f36, #0e0f12 70%);
  }
  #start.gone { display: none; }
  .card {
    width: min(390px, 100%); background: rgba(18,18,20,0.84); border: 1px solid var(--line-soft);
    border-radius: 20px; padding: 24px; text-align: center;
  }
  .card h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card .small { font-size: 11px; margin: 16px 0 0; }
  .card .small a { color: var(--muted); }
  .btn {
    appearance: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
    font: inherit; font-weight: 600; background: var(--glass); color: var(--text); cursor: pointer;
    text-shadow: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #031426; width: 100%; padding: 14px; font-size: 16px; text-shadow: none; }
  .btn.warn { color: var(--danger); }

  /* HUD prompt + toast */
  #hud, #toast {
    position: fixed; z-index: 15; left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--line-soft);
    padding: 8px 15px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  }
  #hud { top: max(16px, env(safe-area-inset-top)); font-size: 14px; }
  #hud:empty { display: none; }
  #toast { z-index: 40; bottom: max(24px, env(safe-area-inset-bottom)); font-size: 13px; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }

  /* Icon rail */
  #rail {
    position: fixed; z-index: 20; right: var(--edge); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: var(--gap);
  }
  .icon {
    width: var(--btn); height: var(--btn); border-radius: 50%; padding: 0; display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--line); color: var(--text); cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .icon svg {
    width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.8));
  }
  .icon.active { border-color: var(--accent); color: var(--accent); background: var(--glass-strong); }
  .icon:active { transform: scale(0.94); }
  .rail-gap { height: 4px; }

  /* Restore circle shown when the UI is hidden */
  #restore {
    position: fixed; z-index: 20; right: calc(var(--edge) + (var(--btn) - 26px) / 2); top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; padding: 0; background: transparent;
    border: 1.5px solid rgba(255, 255, 255, 0.35); display: none; cursor: pointer;
  }
  #restore::before { content: ""; position: absolute; inset: -12px; } /* bigger tap target, same look */

  /* Flyout panel */
  #panel {
    position: fixed; z-index: 20; display: none;
    right: calc(var(--edge) + var(--btn) + 10px); top: 50%; transform: translateY(-50%);
    width: min(300px, calc(100vw - var(--btn) - 40px)); max-height: min(80vh, 600px); overflow-y: auto;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px;
    -webkit-overflow-scrolling: touch;
  }
  #panel.open { display: block; }
  .ptitle { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; font-weight: 650; font-size: 15px; }
  .ptitle button { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 2px 6px; cursor: pointer; text-shadow: inherit; }
  .rows { display: grid; gap: 12px; }
  .row .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .row label { color: var(--muted); font-size: 13px; }
  .row .val { display: flex; align-items: baseline; gap: 3px; }
  .row .unit { color: var(--muted); font-size: 12px; min-width: 10px; }
  .num {
    width: 66px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: var(--text);
    background: rgba(0,0,0,0.25); border: 1px solid var(--line-soft); border-radius: 6px; padding: 2px 6px;
    -webkit-user-select: text; user-select: text; text-shadow: inherit;
  }
  .num:focus { outline: none; border-color: var(--accent); }
  .num::-webkit-inner-spin-button { display: none; }
  .slide { display: flex; align-items: center; gap: 8px; }
  .slide input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; margin: 0; }
  .nudge {
    width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1px solid var(--line-soft);
    font: 600 16px/1 inherit; background: rgba(0,0,0,0.2); color: var(--text); touch-action: manipulation; text-shadow: inherit;
  }
  .nudge:active { background: rgba(255,255,255,0.18); }
  .inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  select, input[type=color] {
    font: inherit; color: var(--text); background: rgba(0,0,0,0.3); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 6px 8px; max-width: 170px;
  }
  input[type=color] { width: 56px; height: 32px; padding: 2px; }
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 13px; background: rgba(255,255,255,0.22); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .hint { color: var(--muted); font-size: 12px; margin: -4px 0 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns .btn { flex: 1 1 auto; font-size: 13px; }
  .status { color: var(--muted); font-size: 12px; margin: -4px 0 0; }
  .credit { color: var(--muted); font-size: 11px; margin: 0; }
  .credit a { color: var(--muted); }

  /* short screens (phone in landscape): smaller icons so the rail fits */
  @media (max-height: 520px) {
    :root { --btn: 36px; --gap: 5px; }
    .icon svg { width: 19px; height: 19px; }
    #panel { max-height: calc(100vh - 20px); }
  }

  body.pre #rail, body.pre #panel { display: none; }
  body.bare #rail, body.bare #panel { display: none; }
  body.bare #restore { display: block; }
  input[type=file] { display: none; }
</style>
</head>
<body class="pre">

<div id="start">

    <h1>AR Floor Viewer</h1>
    <p>Point the camera at the floor and move the phone slowly. Tap the floor to place the model.</p>
    <button class="btn primary" id="startBtn">Start AR</button>
    <p class="small">AR tracking by the 8th Wall Engine © Niantic Spatial, Inc. —
      <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">licence &amp; disclaimer</a></p>
  </div>
</div>

<audio id="music" loop preload="auto" playsinline></audio>
<input type="file" id="fileIn">
<input type="file" id="musicIn">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.THREE = THREE; // the 8th Wall three.js module uses the global THREE

// ---------- Config ----------
const MODEL_URL = 'model.glb';   // your animated model, next to index.html
const MUSIC_URL = 'music.mp3';   // your music track, next to index.html
const FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb';
const STORE_KEY = 'ar-8thwall-settings-v1';
const LICENCE_URL = 'https://github.com/8thwall/engine/blob/main/LICENSE';

const ICONS = {
  place: '<path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/>',
  light: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/>',
  shadow: '<circle cx="12" cy="9" r="5"/><ellipse cx="12" cy="19.5" rx="7.5" ry="2" fill="currentColor" fill-opacity=".35"/>',
  anim: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.3v5.4l4.6-2.7z"/>',
  music: '<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  track: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  model: '<path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 21.5V12M20.5 7.3 12 12 3.5 7.3"/>',
  fsEnter: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  fsExit: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};

// Each entry is one icon in the rail and one flyout panel.
const PANELS = [
  { id: 'place', title: 'Position & rotation', items: [
    { key: 'rotY', label: 'Rotation', min: -180, max: 180, step: 1, def: 0, unit: '°' },
    { key: 'size', label: 'Model height', min: 0.05, max: 10, step: 0.01, def: 1.2, unit: 'm' },
    { key: 'offX', label: 'Nudge left / right', min: -1, max: 1, step: 0.005, def: 0, unit: 'm' },
    { key: 'offZ', label: 'Nudge closer / further', min: -1, max: 1, step: 0.005, def: 0, unit: 'm' },
    { key: 'offY', label: 'Nudge up / down', min: -0.3, max: 0.3, step: 0.002, def: 0, unit: 'm' },
    { type: 'toggle', key: 'lockGestures', label: 'Lock touch gestures', def: false },
    { type: 'buttons', buttons: [{ id: 'placeBtn', label: 'Place again' }] },
    { type: 'hint', text: 'Drag to move, pinch to scale, twist to rotate. Rotation 0 faces where you placed it from.' },
  ]},
  { id: 'light', title: 'Light source', items: [
    { key: 'lightAz', label: 'Light direction (0 = from viewer)', min: -180, max: 180, step: 1, def: 35, unit: '°' },
    { key: 'lightEl', label: 'Light height', min: 3, max: 90, step: 1, def: 50, unit: '°' },
    { key: 'lightInt', label: 'Light intensity', min: 0, max: 10, step: 0.05, def: 2.5 },
    { type: 'color', key: 'lightColor', label: 'Light colour', def: '#fff4e5' },
    { key: 'ambInt', label: 'Ambient light', min: 0, max: 3, step: 0.05, def: 0.4 },
    { type: 'color', key: 'ambColor', label: 'Ambient colour', def: '#dfe8ff' },
    { key: 'envInt', label: 'Reflections', min: 0, max: 3, step: 0.05, def: 0.8 },
    { key: 'exposure', label: 'Exposure', min: 0.2, max: 3, step: 0.01, def: 1 },
    { type: 'hint', text: 'An arrow shows where the light comes from while you adjust direction or height. Point it the way real shadows fall.' },
  ]},
  { id: 'shadow', title: 'Shadow', items: [
    { key: 'shadowOpacity', label: 'Shadow darkness', min: 0, max: 1, step: 0.01, def: 0.45 },
    { key: 'shadowSoft', label: 'Shadow softness', min: 0, max: 12, step: 0.1, def: 3 },
  ]},
  { id: 'anim', title: 'Animation', items: [
    { type: 'clip', key: 'clip', label: 'Clip' },
    { type: 'toggle', key: 'playing', label: 'Playing', def: true },
    { key: 'animSpeed', label: 'Speed', min: 0, max: 3, step: 0.05, def: 1, unit: '×' },
  ]},
  { id: 'music', title: 'Music', items: [
    { type: 'toggle', key: 'musicOn', label: 'Play music (loops)', def: true },
    { key: 'volume', label: 'Volume', min: 0, max: 1, step: 0.01, def: 0.7 },
    { type: 'buttons', buttons: [{ id: 'musicBtn', label: 'Load music…' }] },
  ]},
  { id: 'track', title: 'Tracking', items: [
    { key: 'camH', label: 'Phone height above floor', min: 0.2, max: 3, step: 0.01, def: 1.4, unit: 'm' },
    { type: 'buttons', buttons: [{ id: 'recenterBtn', label: 'Recenter tracking' }] },
    { type: 'hint', text: 'Sets the real-world scale: measure how high the phone is held or mounted. Changing it recenters tracking, so place the model again afterwards.' },
  ]},
  { id: 'model', title: 'Model & settings', items: [
    { type: 'status' },
    { type: 'buttons', buttons: [
      { id: 'loadBtn', label: 'Load model…' }, { id: 'copyBtn', label: 'Copy settings' },
      { id: 'pasteBtn', label: 'Paste settings' }, { id: 'resetBtn', label: 'Reset', warn: true }] },
    { type: 'credit' },
  ]},
];

const DEFAULTS = { clip: '' };
for (const p of PANELS) for (const it of p.items) if (it.key && 'def' in it) DEFAULTS[it.key] = it.def;

// ---------- Settings ----------
let stored = {};
try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch {}
const S = { ...DEFAULTS };
for (const k in DEFAULTS) if (k in stored) S[k] = stored[k];
let sizeIsSet = 'size' in stored;
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} }, 250);
}

// ---------- DOM helpers ----------
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  n.append(...kids);
  return n;
}
const svg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;
const decimals = step => step < 1 ? (String(step).split('.')[1] || '').length : 0;
let toastTimer;
function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}
let statusText = 'Loading model…';
const setStatus = msg => { statusText = msg; const s = $('status'); if (s) s.textContent = msg; };
const setHud = msg => { $('hud').textContent = msg; };

// ---------- Scene content (added to the 8th Wall scene once it starts) ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.blurSamples = 16;

// 8th Wall puts the ground at y = 0, so the shadow catcher lives there
const shadowMat = new THREE.ShadowMaterial({ opacity: 0.45 });
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), shadowMat);
shadowPlane.receiveShadow = true;

const reticle = new THREE.Group();
reticle.add(
  new THREE.Mesh(new THREE.RingGeometry(0.09, 0.11, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff })),
  new THREE.Mesh(new THREE.CircleGeometry(0.015, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff })));
reticle.visible = false;

// Light-direction arrow: a glowing ball at the light source with an arrow pointing at the model.
// Built along +Y (ball at origin, tip at the top) and rotated to point down the light's path.
const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffd36b, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
const arrowShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 12), arrowMat);
const arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.13, 20), arrowMat);
const arrowBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 20, 14), arrowMat);
const lightArrow = new THREE.Group();
lightArrow.add(arrowShaft, arrowHead, arrowBall);
lightArrow.traverse(o => { o.renderOrder = 999; });
lightArrow.visible = false;
let lightTouchedAt = -Infinity;
const ARROW_HOLD_MS = 1200;

const pivot = new THREE.Group();
const inner = new THREE.Group();
pivot.add(inner);

let scene = null, camera = null, renderer = null;
let model = null, mixer = null, clips = [], action = null, naturalHeight = 1;
const timer = new THREE.Timer();

const anchorPos = new THREE.Vector3(0, 0, -2);
let anchorYaw = 0;
let placing = true;

// ---------- Apply settings ----------
const _v = new THREE.Vector3(), _t = new THREE.Vector3(), _q = new THREE.Quaternion(), _down = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function apply() {
  const yaw = anchorYaw;
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const toViewer = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  pivot.position.copy(anchorPos).addScaledVector(right, S.offX).addScaledVector(toViewer, -S.offZ);
  pivot.position.y = S.offY;
  pivot.rotation.y = yaw + rad(S.rotY);
  pivot.scale.setScalar(S.size / naturalHeight);

  shadowPlane.position.set(pivot.position.x, S.offY + 0.001, pivot.position.z);
  shadowPlane.scale.setScalar(Math.max(4, S.size * 6));

  const az = yaw + rad(S.lightAz), el = rad(S.lightEl);
  _v.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)); // from model towards the light
  const dist = Math.max(S.size * 4, 6);
  sun.target.position.copy(pivot.position);
  sun.position.copy(pivot.position).addScaledVector(_v, dist);
  sun.intensity = S.lightInt;
  sun.color.set(S.lightColor);
  const ext = S.size * 1.6 + 0.6;
  Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 0.1, far: dist * 2 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.radius = S.shadowSoft;
  updateLightArrow();

  hemi.intensity = S.ambInt;
  hemi.color.set(S.ambColor);
  shadowMat.opacity = S.shadowOpacity;
  if (scene) scene.environmentIntensity = S.envInt;
  if (renderer) renderer.toneMappingExposure = S.exposure;
  if (mixer) mixer.timeScale = S.playing ? S.animSpeed : 0;
  if (gain) gain.gain.value = S.volume;
}

function updateLightArrow() {
  // aim at the middle of the model, starting out where the light comes from
  _t.copy(pivot.position); _t.y += S.size * 0.5;
  const k = clamp(S.size / 1.2, 0.5, 3);              // thicker arrow for bigger models
  const far = S.size * 0.9 + 0.7, near = S.size * 0.35 + 0.15;
  const len = far - near, headLen = 0.13 * k;
  lightArrow.position.copy(_t).addScaledVector(_v, far);
  _down.copy(_v).negate();
  lightArrow.quaternion.copy(_q.setFromUnitVectors(UP, _down));
  lightArrow.scale.setScalar(1);
  arrowBall.scale.setScalar(k);
  arrowShaft.scale.set(k, Math.max(0.01, len - headLen), k);
  arrowShaft.position.y = (len - headLen) / 2;
  arrowHead.scale.setScalar(k);
  arrowHead.position.y = len - headLen / 2;
  arrowMat.color.set(S.lightColor).lerp(new THREE.Color(0xffd36b), 0.5);
}

// ---------- Panels ----------
const controls = {};
let clipSelect, camHTimer, openPanel = null;

function change(key, v) {
  S[key] = v;
  if (key === 'size') sizeIsSet = true;
  if (key === 'musicOn') v ? playMusic() : music.pause();
  if (key === 'camH') { clearTimeout(camHTimer); camHTimer = setTimeout(applyCameraHeight, 600); }
  if (key === 'lightAz' || key === 'lightEl') lightTouchedAt = performance.now();
  controls[key]?.(v);
  apply();
  save();
}

function rangeRow(it) {
  const range = el('input', { type: 'range', min: it.min, max: it.max, step: it.step });
  const num = el('input', { type: 'number', class: 'num', min: it.min, max: it.max, step: it.step, inputmode: 'decimal' });
  const minus = el('button', { class: 'nudge', type: 'button', 'aria-label': 'Decrease' }, '−');
  const plus = el('button', { class: 'nudge', type: 'button', 'aria-label': 'Increase' }, '+');
  const d = decimals(it.step);
  controls[it.key] = v => { range.value = v; if (document.activeElement !== num) num.value = (+v).toFixed(d); };
  range.addEventListener('input', () => change(it.key, parseFloat(range.value)));
  num.addEventListener('change', () => {
    const v = parseFloat(num.value);
    change(it.key, isNaN(v) ? S[it.key] : clamp(v, it.min, it.max));
    num.value = (+S[it.key]).toFixed(d);
  });
  const nudge = sign => change(it.key, clamp(+(S[it.key] + sign * it.step).toFixed(d), it.min, it.max));
  for (const [b, sign] of [[minus, -1], [plus, 1]]) {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); nudge(sign);
      t1 = setTimeout(() => { t2 = setInterval(() => nudge(sign), 50); }, 380);
    });
    b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  }
  return el('div', { class: 'row' },
    el('div', { class: 'top' }, el('label', {}, it.label), el('span', { class: 'val' }, num, el('span', { class: 'unit' }, it.unit || ''))),
    el('div', { class: 'slide' }, minus, range, plus));
}
const inlineRow = (label, control) => el('div', { class: 'row inline' }, el('label', {}, label), control);

function buildItem(it) {
  switch (it.type) {
    case 'hint': return el('p', { class: 'hint' }, it.text);
    case 'status': { const p = el('p', { class: 'status', id: 'status' }, statusText); return p; }
    case 'credit': {
      const p = el('p', { class: 'credit' }, 'AR tracking: 8th Wall Engine © Niantic Spatial, Inc. Used under the ');
      p.append(el('a', { href: LICENCE_URL, target: '_blank', rel: 'noopener' }, '8th Wall Engine Binary License'),
        ', provided “as is” without warranty. Not affiliated with or endorsed by Niantic Spatial.');
      return p;
    }
    case 'buttons':
      return el('div', { class: 'btns' }, ...it.buttons.map(b => el('button', { class: 'btn' + (b.warn ? ' warn' : ''), id: b.id, type: 'button' }, b.label)));
    case 'toggle': {
      const cb = el('input', { type: 'checkbox' });
      controls[it.key] = v => { cb.checked = !!v; };
      cb.addEventListener('change', () => change(it.key, cb.checked));
      return inlineRow(it.label, el('label', { class: 'switch' }, cb, el('span')));
    }
    case 'color': {
      const c = el('input', { type: 'color' });
      controls[it.key] = v => { c.value = v; };
      c.addEventListener('input', () => change(it.key, c.value));
      return inlineRow(it.label, c);
    }
    case 'clip': {
      clipSelect = el('select', {}, el('option', {}, '—'));
      clipSelect.addEventListener('change', () => { S.clip = clipSelect.value; playClip(); save(); });
      return inlineRow(it.label, clipSelect);
    }
    default: return rangeRow(it);
  }
}

const panelBodies = {}, railButtons = {};
function buildUI() {
  const rail = $('rail'), panel = $('panel');
  for (const p of PANELS) {
    const close = el('button', { type: 'button', 'aria-label': 'Close' }, '✕');
    close.onclick = () => showPanel(null);
    panelBodies[p.id] = el('div', {}, el('div', { class: 'ptitle' }, el('span', {}, p.title), close),
      el('div', { class: 'rows' }, ...p.items.map(buildItem)));
    const b = el('button', { class: 'icon', type: 'button', 'aria-label': p.title, title: p.title });
    b.innerHTML = svg(p.id);
    b.onclick = () => showPanel(openPanel === p.id ? null : p.id);
    railButtons[p.id] = b;
    rail.append(b);
  }
  rail.append(el('div', { class: 'rail-gap' }));

  const fs = el('button', { class: 'icon', type: 'button', id: 'fsBtn', 'aria-label': 'Toggle fullscreen', title: 'Fullscreen' });
  fs.innerHTML = svg('fsEnter');
  fs.onclick = toggleFullscreen;
  if (!fullscreenSupported()) fs.style.display = 'none';
  const eye = el('button', { class: 'icon', type: 'button', id: 'eyeBtn', 'aria-label': 'Hide controls', title: 'Hide controls' });
  eye.innerHTML = svg('eye');
  eye.onclick = () => setBare(true);
  rail.append(fs, eye);
  panel.replaceChildren();
}
function showPanel(id) {
  openPanel = id;
  for (const k in railButtons) railButtons[k].classList.toggle('active', k === id);
  const panel = $('panel');
  panel.replaceChildren(...(id ? [panelBodies[id]] : []));
  panel.classList.toggle('open', !!id);
}
function setBare(on) {
  document.body.classList.toggle('bare', on);
  if (on) toast('Tap the circle or double-tap to show controls', 2500);
}
const refreshUI = () => { for (const k in controls) controls[k](S[k]); };

// ---------- Fullscreen ----------
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function fullscreenSupported() {
  const d = document.documentElement;
  return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(d.requestFullscreen || d.webkitRequestFullscreen);
}
function enterFullscreen() {
  const d = document.documentElement;
  try { (d.requestFullscreen || d.webkitRequestFullscreen).call(d)?.catch?.(() => {}); } catch {}
}
function toggleFullscreen() {
  if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document)?.catch?.(() => {});
  else enterFullscreen();
}
function onFullscreenChange() {
  const b = $('fsBtn');
  if (b) { b.innerHTML = svg(fsElement() ? 'fsExit' : 'fsEnter'); b.classList.toggle('active', !!fsElement()); }
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

// ---------- Model ----------
const loader = new GLTFLoader();
loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/libs/draco/gltf/'));
loader.setMeshoptDecoder(MeshoptDecoder);

function setModel(gltf, name, isFallback) {
  if (model) { inner.remove(model); mixer?.stopAllAction(); action = null; }
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  model.position.set(-center.x, -box.min.y, -center.z);
  inner.add(model);
  naturalHeight = size.y > 1e-6 ? size.y : 1;
  if (!sizeIsSet) S.size = isFallback ? 1.2 : (naturalHeight >= 0.05 && naturalHeight <= 10 ? +naturalHeight.toFixed(2) : 1);

  mixer = new THREE.AnimationMixer(model);
  clips = gltf.animations || [];
  clipSelect.replaceChildren(...(clips.length ? clips.map(c => el('option', { value: c.name }, c.name || '(unnamed)')) : [el('option', {}, 'No animations')]));
  clipSelect.disabled = !clips.length;
  if (!clips.find(c => c.name === S.clip)) S.clip = (clips.find(c => /dance|idle/i.test(c.name)) || clips[0])?.name || '';
  clipSelect.value = S.clip;
  playClip();
  apply(); refreshUI();
  setStatus(name + (clips.length ? ` · ${clips.length} animations` : ''));
}
function playClip() {
  if (!mixer) return;
  const clip = clips.find(c => c.name === S.clip);
  const next = clip ? mixer.clipAction(clip) : null;
  if (next === action) return;
  if (action && next) { next.reset().play(); action.crossFadeTo(next, 0.3, false); }
  else if (next) next.play();
  else action?.stop();
  action = next;
}
function loadModel(url, name, isFallback = false) {
  return new Promise((resolve, reject) => {
    setStatus('Loading model…');
    loader.load(url, gltf => { setModel(gltf, name, isFallback); resolve(); },
      e => { if (e.total) setStatus(`Loading ${Math.round(e.loaded / e.total * 100)}%`); }, reject);
  });
}

// ---------- Music (Web Audio so volume works on iOS) ----------
const music = $('music');
music.src = MUSIC_URL;
let musicMissing = false, audioCtx = null, gain = null;
music.addEventListener('error', () => { musicMissing = true; });
function unlockAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gain = audioCtx.createGain();
      audioCtx.createMediaElementSource(music).connect(gain).connect(audioCtx.destination);
      gain.gain.value = S.volume;
    } catch { audioCtx = null; }
  }
  audioCtx?.resume?.();
}
function playMusic() {
  if (musicMissing) { toast('No music.mp3 found — use "Load music…"'); return; }
  unlockAudio();
  music.play().catch(() => {});
}
// iOS pauses audio when the page is hidden — resume when it comes back
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && started && S.musicOn) playMusic();
});

// ---------- Floor raycasting ----------
const raycaster = new THREE.Raycaster();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const _ndc = new THREE.Vector2(), _hit = new THREE.Vector3();
function floorHit(clientX, clientY) {
  if (!camera) return null;
  camera.updateMatrixWorld();
  _ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const p = raycaster.ray.intersectPlane(floorPlane, _hit);
  // ignore hits behind the camera or absurdly far away (pointing at the horizon)
  return p && p.distanceTo(camera.position) < 25 ? p.clone() : null;
}
function faceViewer(p) {
  anchorYaw = Math.atan2(camera.position.x - p.x, camera.position.z - p.z);
}
function startPlacing() {
  placing = true;
  setHud('Point at the floor, then tap to place');
}
function place(p) {
  anchorPos.set(p.x, 0, p.z);
  faceViewer(p);
  placing = false;
  reticle.visible = false;
  pivot.visible = shadowPlane.visible = true;
  apply();
  setHud('');
  toast('Placed — drag to move, pinch to scale', 2500);
}

// ---------- 8th Wall pipeline ----------
function applyCameraHeight() {
  if (!started || !window.XR8 || !camera) return;
  camera.position.set(0, S.camH, 0);
  XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });
  XR8.XrController.recenter();
  startPlacing();
  toast('Tracking recentered — place the model again');
}

const scenePipelineModule = () => ({
  name: 'floorviewer',
  onStart: ({ canvas }) => {
    ({ scene, camera, renderer } = XR8.Threejs.xrScene());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    try {
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    } catch (e) { console.warn('Environment map unavailable', e); }

    scene.add(hemi, sun, sun.target, shadowPlane, reticle, pivot, lightArrow);
    pivot.visible = shadowPlane.visible = false;

    // Camera starts at the phone's height above the floor; this sets the scale of the world
    camera.position.set(0, S.camH, 0);
    XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });

    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    apply();
    startPlacing();
    document.body.classList.remove('pre');
  },
  onUpdate: () => {
    timer.update();
    const dt = timer.getDelta();
    mixer?.update(dt);
    if (placing && camera) {
      // preview the model on the floor under the centre of the screen
      const p = floorHit(innerWidth / 2, innerHeight / 2);
      reticle.visible = !!p;
      pivot.visible = shadowPlane.visible = !!p;
      if (p) {
        reticle.position.set(p.x, 0.002, p.z);
        anchorPos.set(p.x, 0, p.z);
        faceViewer(p);
        apply();
      }
    }
    // fade the light arrow in while the light is being moved, out shortly after
    const target = performance.now() - lightTouchedAt < ARROW_HOLD_MS && pivot.visible ? 0.95 : 0;
    arrowMat.opacity += (target - arrowMat.opacity) * Math.min(1, dt * (target > arrowMat.opacity ? 10 : 4));
    lightArrow.visible = arrowMat.opacity > 0.01;
  },
});

let started = false;
function waitForXR() {
  return new Promise(res => window.XR8 ? res() : window.addEventListener('xrloaded', res, { once: true }));
}
async function start() {
  if (started) return;
  started = true;
  if (S.musicOn) playMusic(); else unlockAudio();   // must happen inside the tap
  enterFullscreen();                                // the camera prompt may exit it — use the fullscreen button to return
  $('start').classList.add('gone');
  setHud('Starting camera…');
  await waitForXR();
  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(),      // draws the camera feed
    XR8.Threejs.pipelineModule(),                // creates the three.js AR scene
    XR8.XrController.pipelineModule(),           // SLAM world tracking
    LandingPage.pipelineModule(),                // explains unsupported browsers / desktop
    XRExtras.FullWindowCanvas.pipelineModule(),  // canvas fills the window
    XRExtras.Loading.pipelineModule(),           // loading + permission prompts
    XRExtras.RuntimeError.pipelineModule(),      // shows runtime errors
    scenePipelineModule(),
  ]);
  XR8.run({ canvas: $('camerafeed') });
}

// ---------- Touch gestures ----------
const canvas = $('camerafeed');
let gesture = null, downInfo = null, lastTap = 0;
const touchesXY = e => [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));

function beginGesture(pts) {
  gesture = null;
  if (placing || S.lockGestures || !model) return;
  if (pts.length === 1) {
    const hit = floorHit(pts[0].x, pts[0].y);
    if (hit) gesture = { type: 'drag', dx: anchorPos.x - hit.x, dz: anchorPos.z - hit.z };
  } else if (pts.length === 2) {
    const [a, b] = pts;
    gesture = { type: 'pinch', d0: Math.hypot(b.x - a.x, b.y - a.y), a0: Math.atan2(b.y - a.y, b.x - a.x), size0: S.size, rot0: S.rotY };
  }
}
canvas.addEventListener('touchstart', e => {
  const pts = touchesXY(e);
  if (pts.length === 1) downInfo = { ...pts[0], t: performance.now() };
  else downInfo = null;
  beginGesture(pts);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!gesture) return;
  const pts = touchesXY(e);
  if (gesture.type === 'drag' && pts.length === 1) {
    const hit = floorHit(pts[0].x, pts[0].y);
    if (!hit) return;
    anchorPos.set(hit.x + gesture.dx, 0, hit.z + gesture.dz);
  } else if (gesture.type === 'pinch' && pts.length === 2) {
    const [a, b] = pts;
    const d = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
    S.size = clamp(gesture.size0 * d / gesture.d0, 0.05, 10);
    sizeIsSet = true;
    S.rotY = Math.round((((gesture.rot0 - deg(ang - gesture.a0)) + 540) % 360) - 180);
    queueUI();
  }
  apply();
}, { passive: true });
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  if (downInfo && e.touches.length === 0 && t) {
    const quick = performance.now() - downInfo.t < 280 && Math.hypot(t.clientX - downInfo.x, t.clientY - downInfo.y) < 12;
    if (quick) {
      if (placing) {
        const p = floorHit(t.clientX, t.clientY);
        if (p) place(p);
      } else {
        const now = performance.now();
        if (now - lastTap < 350) { setBare(!document.body.classList.contains('bare')); lastTap = 0; }
        else lastTap = now;
      }
    }
  }
  beginGesture(touchesXY(e));
  if (e.touches.length === 0) downInfo = null;
}, { passive: true });

let uiQueued = false;
function queueUI() {
  if (uiQueued) return;
  uiQueued = true;
  requestAnimationFrame(() => { uiQueued = false; refreshUI(); save(); });
}

// ---------- Build UI and wire buttons ----------
buildUI();
// panel buttons live inside panels that aren't in the DOM until opened, so look them up via the panel bodies
const btn = id => { for (const k in panelBodies) { const b = panelBodies[k].querySelector('#' + id); if (b) return b; } };

$('startBtn').onclick = start;
$('restore').onclick = () => setBare(false);
btn('placeBtn').onclick = () => { showPanel(null); startPlacing(); };
btn('recenterBtn').onclick = () => {
  if (!started || !window.XR8) return;
  XR8.XrController.recenter();
  showPanel(null);
  startPlacing();
  toast('Tracking recentered — place the model again');
};
btn('musicBtn').onclick = () => $('musicIn').click();
$('musicIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  musicMissing = false;
  music.src = URL.createObjectURL(f);
  if (S.musicOn) playMusic();
  toast(`Music: ${f.name} (this session only)`);
  e.target.value = '';
};
btn('loadBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  loadModel(url, f.name).then(() => toast(`Loaded ${f.name} (this session only)`))
    .catch(() => toast('Could not read that file — use a .glb')).finally(() => URL.revokeObjectURL(url));
  e.target.value = '';
};
btn('resetBtn').onclick = () => {
  if (!confirm('Reset all settings to defaults?')) return;
  const oldH = S.camH;
  Object.assign(S, DEFAULTS);
  sizeIsSet = false;
  if (model) S.size = naturalHeight >= 0.05 && naturalHeight <= 10 ? +naturalHeight.toFixed(2) : 1.2;
  apply(); refreshUI(); save(); playClip();
  if (S.camH !== oldH) applyCameraHeight();
};
btn('copyBtn').onclick = async () => {
  const txt = JSON.stringify(S);
  try { await navigator.clipboard.writeText(txt); toast('Settings copied'); }
  catch { prompt('Copy these settings:', txt); }
};
btn('pasteBtn').onclick = () => {
  const txt = prompt('Paste settings JSON:');
  if (!txt) return;
  try {
    const obj = JSON.parse(txt);
    const oldH = S.camH;
    for (const k in DEFAULTS) if (k in obj) S[k] = obj[k];
    sizeIsSet = 'size' in obj || sizeIsSet;
    apply(); refreshUI(); save(); playClip();
    if (S.camH !== oldH) applyCameraHeight();
    toast('Settings applied');
  } catch { toast('That is not valid settings JSON'); }
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h') setBare(!document.body.classList.contains('bare'));
});

// ---------- Go ----------
refreshUI();
apply();
loadModel(MODEL_URL, 'model.glb').catch(() =>
  loadModel(FALLBACK_URL, 'Demo robot (add model.glb)', true).catch(() => setStatus('Model failed to load')));
</script>
</body>
</html>
